<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Student Registration Form</h1>
            <p>Please fill in the information below to register.</p>
        </header>

        <form id="registrationForm">

            <!-- PERSONAL INFORMATION -->
            <h2>Personal Information</h2>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- DATE OF BIRTH -->
            <div class="form-group">
                <label>Date of Birth</label>

                <div class="dob-group">

                    <!-- DAY -->
                    <select id="day" name="day" required>
                        <option value="">Day</option>

                        <script>
                            for (let day = 1; day <= 31; day++) {
                                document.write(
                                    `<option value="${day}">${day}</option>`
                                );
                            }
                        </script>
                    </select>

                    <!-- MONTH -->
                    <select id="month" name="month" required>
                        <option value="">Month</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>

                    <!-- YEAR -->
                    <select id="year" name="year" required>
                        <option value="">Year</option>

                        <script>
                            const currentYear = new Date().getFullYear();

                            for (
                                let year = currentYear;
                                year >= 1950;
                                year--
                            ) {
                                document.write(
                                    `<option value="${year}">${year}</option>`
                                );
                            }
                        </script>
                    </select>

                </div>
            </div>

            <!-- GENDER -->
            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                </div>
            </div>


            <!-- CONTACT INFORMATION -->
            <h2>Contact Information</h2>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="08012345678"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Home Address</label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your home address"
                    required
                ></textarea>
            </div>


            <!-- ACADEMIC INFORMATION -->
            <h2>Academic Information</h2>

            <div class="form-group">
                <label for="state">State of Origin</label>

                <select
                    id="state"
                    name="state"
                    required
                >
                    <option value="">Select your state</option>

                    <option>Abia</option>
                    <option>Adamawa</option>
                    <option>Akwa Ibom</option>
                    <option>Anambra</option>
                    <option>Bauchi</option>
                    <option>Bayelsa</option>
                    <option>Benue</option>
                    <option>Borno</option>
                    <option>Cross River</option>
                    <option>Delta</option>
                    <option>Ebonyi</option>
                    <option>Edo</option>
                    <option>Ekiti</option>
                    <option>Enugu</option>
                    <option>Gombe</option>
                    <option>Imo</option>
                    <option>Jigawa</option>
                    <option>Kaduna</option>
                    <option>Kano</option>
                    <option>Katsina</option>
                    <option>Kebbi</option>
                    <option>Kogi</option>
                    <option>Kwara</option>
                    <option>Lagos</option>
                    <option>Nasarawa</option>
                    <option>Niger</option>
                    <option>Ogun</option>
                    <option>Ondo</option>
                    <option>Osun</option>
                    <option>Oyo</option>
                    <option>Plateau</option>
                    <option>Rivers</option>
                    <option>Sokoto</option>
                    <option>Taraba</option>
                    <option>Yobe</option>
                    <option>Zamfara</option>
                    <option>FCT</option>
                </select>
            </div>


            <div class="form-group">
                <label for="department">Department</label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="e.g. Computer Science"
                    required
                >
            </div>


            <div class="form-group">
                <label for="level">Level</label>

                <select
                    id="level"
                    name="level"
                    required
                >
                    <option value="">Select level</option>
                    <option>100 Level</option>
                    <option>200 Level</option>
                    <option>300 Level</option>
                    <option>400 Level</option>
                    <option>500 Level</option>
                </select>
            </div>


            <div class="form-group">
                <label for="school">Previous School</label>

                <input
                    type="text"
                    id="school"
                    name="school"
                    placeholder="Enter your previous school"
                >
            </div>


            <!-- PASSPORT -->
         <h2>Passport Photograph</h2>
          <div class="form-group">

      <label for="passport">
            Upload Passport
      </label>

    <input
        type="file"
        id="passport"
        name="passport"
        accept="image/jpeg,image/png,image/webp"
        required
    >

    <small>
        Upload a clear passport photograph. Maximum size: 2MB.
    </small>

</div>


            <!-- ACCOUNT INFORMATION -->
            <h2>Account Information</h2>

            <div class="form-group">

                <label for="password">
                    Create Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <!-- TERMS -->
            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I confirm that the information
                    provided is correct.

                </label>

            </div>


            <!-- SUBMIT -->
            <button type="submit">
                Register Now
            </button>

        </form>


        <!-- MESSAGE -->
        <div id="message"></div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
